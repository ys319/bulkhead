# A tag vX.Y.Z makes a draft release with one binary per system, their
# checksums and, for each binary, an attestation of where it was built
# (gh attestation verify <file> --repo ys319/bulkhead). Publishing the draft
# is done by hand.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The jobs are split by what they may do:
#
#   test     the tests, on the three systems            reads the repository
#   build    scripts/build-release.sh                   reads the repository
#   release  attests and uploads what build made        writes the release
#
# The job that runs the Go toolchain over the dependencies has nothing to
# sign or publish with, and the job that can publish runs no code of this
# repository. Signing (Authenticode for Windows, Developer ID and
# notarization for macOS) will be jobs of their own between build and
# release, each in an environment that holds its certificate and asks for
# approval: they take the artifact, sign their system's files and hand the
# files on. Nothing else has to move. See docs/rewrite-spec-draft.md §10.
#
# Actions are pinned to a commit (the comment says which release it is), and
# a release younger than a week is not taken — §15 of the same document.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # the toolchain line
          # Nothing from an earlier run goes into a release.
          cache: false
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          BH_COMMIT: ${{ github.sha }}
        run: |
          case "$TAG" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "not a version tag: $TAG"; exit 1 ;;
          esac
          BH_COMMIT=$(printf %s "$BH_COMMIT" | cut -c1-7) scripts/build-release.sh "${TAG#v}"
      - name: The binary says what it is
        run: ./dist/bh-linux-amd64 version || true # exits non-zero without a Docker Engine to describe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/bh-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the draft release
      id-token: write # the attestation is signed as this workflow run
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: The files are the ones that were built
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=
          case "$TAG" in
          *-*) prerelease=--prerelease ;;
          esac
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes $prerelease \
            dist/bh-* dist/SHA256SUMS
